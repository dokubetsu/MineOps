name: MineOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Verification (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Setup Supabase Local Development CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Stack & Seed DB
        run: |
          supabase start || (docker logs supabase_db_idea2 && docker logs supabase_auth_idea2 && exit 1)
          STATUS_JSON=$(supabase status -o json)
          echo "Supabase Status Output: $STATUS_JSON"
          
          ANON_KEY=$(echo $STATUS_JSON | jq -r 'if .["anon.key"] != null and .["anon.key"] != "null" then .["anon.key"] else .["anon_key"] end')
          SERVICE_KEY=$(echo $STATUS_JSON | jq -r 'if .["service.key"] != null and .["service.key"] != "null" then .["service.key"] else (if .["service_role_key"] != null and .["service_role_key"] != "null" then .["service_role_key"] else .["service_key"] end) end')
          
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "JSON parsing returned null; falling back to status text parsing..."
            STATUS_TEXT=$(supabase status)
            ANON_KEY=$(echo "$STATUS_TEXT" | grep -i "anon key" | sed 's/.*anon key: //I' | tr -d '[:space:]')
            SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -i "service_role key" | sed 's/.*service_role key: //I' | tr -d '[:space:]')
          fi
          
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV

      - name: Type Check & Verify
        run: |
          cd frontend
          npm run test

      - name: Production Build Verification
        run: |
          cd frontend
          npm run build

      - name: Install Playwright Chromium Browser
        run: |
          cd frontend
          npx playwright install chromium --with-deps

      - name: Run E2E Integration Tests
        run: |
          cd frontend
          npm run test:e2e



