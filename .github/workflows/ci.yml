name: MineOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Verification (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Setup Supabase Local Development CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Stack & Seed DB
        run: |
          supabase start || (docker logs supabase_db_idea2 && docker logs supabase_auth_idea2 && exit 1)
          
          ANON_KEY=""
          SERVICE_KEY=""
          
          echo "=== DEBUG: Supabase CLI version ==="
          supabase --version || true
          echo "=== DEBUG: Checking supabase/.temp/ ==="
          ls -la supabase/.temp/ 2>/dev/null || echo "supabase/.temp/ does not exist"
          echo "=== DEBUG: supabase status raw output ==="
          supabase status 2>&1 || true
          echo "=== DEBUG: supabase status --output env ==="
          supabase status --output env 2>&1 || true
          
          if [ -f supabase/.temp/api-keys ]; then
            echo ">>> Method 1: Parsing from supabase/.temp/api-keys"
            cat supabase/.temp/api-keys
            ANON_KEY=$(grep "anon=" supabase/.temp/api-keys | cut -d'=' -f2- | tr -d '[:space:]')
            SERVICE_KEY=$(grep "service_role=" supabase/.temp/api-keys | cut -d'=' -f2- | tr -d '[:space:]')
          fi
          
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo ">>> Method 2: Trying --output env"
            ENV_OUTPUT=$(supabase status --output env 2>/dev/null || echo "")
            ANON_KEY=$(echo "$ENV_OUTPUT" | grep "ANON_KEY=" | cut -d'=' -f2- | tr -d '[:space:]' | tr -d '"')
            SERVICE_KEY=$(echo "$ENV_OUTPUT" | grep "SERVICE_ROLE_KEY=" | cut -d'=' -f2- | tr -d '[:space:]' | tr -d '"')
          fi
          
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo ">>> Method 3: Trying -o json / --output json"
            STATUS_JSON=$(supabase status -o json 2>/dev/null || supabase status --output json 2>/dev/null || echo "{}")
            ANON_KEY=$(echo "$STATUS_JSON" | jq -r '(.["anon_key"] // .["anon.key"] // .["ANON_KEY"] // empty)' 2>/dev/null)
            SERVICE_KEY=$(echo "$STATUS_JSON" | jq -r '(.["service_role_key"] // .["service.key"] // .["SERVICE_ROLE_KEY"] // empty)' 2>/dev/null)
          fi
          
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo ">>> Method 4: Trying status text grep"
            STATUS_TEXT=$(supabase status 2>/dev/null || echo "")
            ANON_KEY=$(echo "$STATUS_TEXT" | grep -i "anon" | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+')
            SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -i "service" | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+')
          fi
          
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo ">>> Method 5: Using well-known default Supabase local dev keys"
            ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
            SERVICE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
          fi
          
          echo "Extracted ANON_KEY length: ${#ANON_KEY}"
          echo "Extracted SERVICE_KEY length: ${#SERVICE_KEY}"
          
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Production dependency audit
        run: |
          cd frontend
          npm run audit:prod

      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install chromium --with-deps

      - name: Unit tests (pure + multi-tenant DB probes)
        run: |
          cd frontend
          npm run test:unit
        env:
          PW_SKIP_WEBSERVER: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Production Build Verification
        run: |
          cd frontend
          npm run build

      - name: E2E (desktop chromium)
        run: |
          cd frontend
          npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: admin@mineops.com
          E2E_ADMIN_PASSWORD: password123

      - name: E2E mobile smoke (Pixel 5)
        run: |
          cd frontend
          npm run test:e2e:mobile
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: admin@mineops.com
          E2E_ADMIN_PASSWORD: password123
